name: Publish NutriPlus Meta Replies UI Image

on:
  push:
    branches:
      - feature/meta-native-message-replies-ui
    paths:
      - .github/workflows/nutriplus-meta-replies-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout validated Chatwoot source
        uses: actions/checkout@v4
        with:
          ref: 8e0abc6a829c27b9a60550c03aa900ce812a70ba

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact validated image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/crnutriplus/chatwoot-nutriplus:4.17.0-meta-replies-ui
            ghcr.io/crnutriplus/chatwoot-nutriplus:4.17.0-meta-replies-ui-8e0abc6a
          cache-from: type=gha
          cache-to: type=gha,mode=max
