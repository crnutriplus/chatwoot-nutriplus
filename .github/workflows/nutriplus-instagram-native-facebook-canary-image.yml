name: Publish NutriPlus Instagram Native Facebook Canary Image

on:
  push:
    branches:
      - feature/instagram-native-reply-facebook-canary
    paths:
      - .github/workflows/nutriplus-instagram-native-facebook-canary-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact validated canary source
        uses: actions/checkout@v4
        with:
          ref: 9587321f9ae5a1c3d7770ca9948694cc9ab605df

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact validated canary image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/crnutriplus/chatwoot-nutriplus:4.17.0-instagram-native-facebook-canary-9587321f
          cache-from: type=gha
          cache-to: type=gha,mode=max
