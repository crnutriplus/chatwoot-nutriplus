name: Build NutriPlus Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit SHA already merged into develop
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  validate-build-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout develop history
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Validate release commit
        id: release
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character Git SHA" >&2
            exit 1
          fi

          git cat-file -e "$COMMIT_SHA^{commit}"

          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/develop; then
            echo "Refusing to publish: commit is not contained in origin/develop" >&2
            exit 1
          fi

          SHORT_SHA="${COMMIT_SHA:0:9}"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          git checkout --detach "$COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/crnutriplus/chatwoot-nutriplus:deploy-${{ steps.release.outputs.short_sha }}
            ghcr.io/crnutriplus/chatwoot-nutriplus:sha-${{ steps.release.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.commit_sha }}
            org.opencontainers.image.source=https://github.com/crnutriplus/chatwoot-nutriplus
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## NutriPlus release image"
            echo
            echo "- Commit: \`${{ steps.release.outputs.commit_sha }}\`"
            echo "- Architecture: \`linux/amd64\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Image: \`ghcr.io/crnutriplus/chatwoot-nutriplus@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
